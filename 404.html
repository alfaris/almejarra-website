<!doctype html>
<html lang="ar" dir="rtl">
  <head>

    <title>الصفحة مش موجودة | المجرة</title>

    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
        color: #fff;
        background:
          radial-gradient(50% 45% at 50% 40%, rgba(142, 42, 140, 0.45), transparent 70%),
          radial-gradient(35% 30% at 80% 20%, rgba(63, 182, 255, 0.18), transparent 70%),
          #0c0313;
      }
      main { max-width: 34rem; text-align: center; }
      img { width: 96px; height: auto; }
      .code { margin: 24px 0 0; font-size: 72px; font-weight: 700; line-height: 1; color: #ffd27a; letter-spacing: 0.04em; }
      h1 { margin: 12px 0 8px; font-size: 26px; }

      .en { margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.12); }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }
      a.btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        color: #0c0313;
        background: #ffd27a;
      }
      a.btn.ghost { color: #fff; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
      a.btn:focus-visible { outline: 3px solid #ffd27a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo-mark.png" alt="المجرة" width="292" height="189" />
      <p class="code" aria-hidden="true">404</p>

      <div class="actions">
        <a class="btn" href="/">الرئيسية</a>
        <a class="btn ghost" href="https://wa.me/201005048220">واتساب</a>
      </div>
      <div class="en" lang="en" dir="ltr">

        <div class="actions">
          <a class="btn ghost" href="/en/">AlMejarra in English</a>
